# CRM origin served by XAMPP's Apache, reached only through the Cloudflare tunnel.
# Included from the bottom of C:/xampp/apache/conf/httpd.conf.
#
# Bound to loopback on purpose: cloudflared connects from this machine, so the CRM is
# not exposed on the office LAN even if a PC firewall rule changes.

Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName crm-origin
    DocumentRoot "D:/Company/I-TECH-MEDIA/CRM-SYSTEM/public"

    <Directory "D:/Company/I-TECH-MEDIA/CRM-SYSTEM/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require ip 127.0.0.1
    </Directory>

    # Uploaded student documents and CSV imports are read back through PHP, so keep the
    # storage symlink reachable.
    <Directory "D:/Company/I-TECH-MEDIA/CRM-SYSTEM/storage/app/public">
        Require ip 127.0.0.1
    </Directory>

    ErrorLog "logs/crm-error.log"
    CustomLog "logs/crm-access.log" combined
</VirtualHost>
